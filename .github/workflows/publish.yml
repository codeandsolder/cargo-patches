name: Import and publish patched crates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cargo-patches-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-26
      - name: Install native validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binutils ripgrep jq clang cmake
      - uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@4d1f6661ec4de02760706d415ca37c5628cca4c4 # main
        with:
          rust-toolchain: nightly-2026-11-26
      - run: node scripts/publish.mjs --check
      - if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@4d1f6661ec4de02760706d415ca37c5628cca4c4 # main
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/publish.mjs --publish
